<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff8a3d" />
    <title>Build a Gun Army</title>
    <meta name="description" content="Build a Gun Army - unbox guns, line your walls with firepower and hold back an endless zombie horde. A 3D idle defense game." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <canvas id="fx2d"></canvas>
      <div id="labels"></div>
      <div id="ui"></div>
      <div id="joystick"><div class="knob"></div></div>
    </div>
    <div id="loading">
      <div class="logo"><span class="l1">BUILD A</span><span class="l2">GUN</span><span class="l3">ARMY</span></div>
      <div class="load-bar"><div class="fill" id="loadFill"></div></div>
      <div class="load-tip" id="loadTip">Loading the armory...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
